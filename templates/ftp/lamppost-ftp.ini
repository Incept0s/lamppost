# LAMPPost - FTP server
#
# These are FTP-only accounts of this FTP server - not your
# Linux password. Connect to ftp://localhost with the user below; you land in
# htdocs, so uploaded files are immediately on your web server.
# Restart the FTP server in the LAMPPost Control Panel after editing this file.

[server]
address = 127.0.0.1
port = 21
passive_ports = 50000-50050
banner = LAMPPost FTP Server ready

# One section per user: [user:NAME]
# permissions: e=cd l=list r=download a=append d=delete f=rename
#              m=mkdir w=upload M=chmod T=change time
[user:lamppost]
password = @FTP_PASSWORD@
home = @PREFIX@/htdocs
permissions = elradfmwMT
