; LAMPPost - PHP configuration
;
; The PHP program comes from Fedora (updated by dnf). Extensions are loaded
; from Fedora's /etc/php.d/*.ini after this file. The settings below are
; tuned for local development, like XAMPP: errors are shown in the browser.
; Restart Apache in the LAMPPost Control Panel after editing this file.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
expose_php = On

max_execution_time = 120
max_input_time = 60
max_input_vars = 5000
memory_limit = 512M

error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
html_errors = On
error_log = "@PREFIX@/php/logs/php_error_log"

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
default_mimetype = "text/html"
default_charset = "UTF-8"

post_max_size = 128M
file_uploads = On
upload_tmp_dir = "@PREFIX@/tmp"
upload_max_filesize = 128M
max_file_uploads = 20

allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
sys_temp_dir = "@PREFIX@/tmp"

[Date]
date.timezone = "@TZ@"

[mail function]
; mail() does not send anything: every mail is saved as a file in
; @PREFIX@/mailoutput (like XAMPP's "mailtodisk").
sendmail_path = "@PREFIX@/mailtodisk/mailtodisk"
mail.add_x_header = Off

[MySQLi]
mysqli.default_host = localhost
mysqli.default_port = 3306
mysqli.default_socket = "@PREFIX@/tmp/mysql.sock"

[Pdo_mysql]
pdo_mysql.default_socket = "@PREFIX@/tmp/mysql.sock"

[Session]
session.save_handler = files
session.save_path = "@PREFIX@/tmp/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.cookie_httponly = 1
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

[opcache]
; Check for changed files on every request (development setting)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
