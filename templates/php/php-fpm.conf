; LAMPPost - PHP-FPM configuration
; Started and stopped together with Apache. Apache hands .php requests to
; the socket below.

[global]
pid = @PREFIX@/tmp/php-fpm.pid
error_log = @PREFIX@/php/logs/php-fpm.log
daemonize = yes

[lamppost]
; runs as your user (like Apache), so no user/group settings are needed
listen = @PREFIX@/tmp/php-fpm.sock
listen.mode = 0600

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

catch_workers_output = yes
decorate_workers_output = no

; Lets phpMyAdmin know it runs under LAMPPost (see phpMyAdmin/config.inc.php)
env[LAMPPOST] = 1
env[PATH] = /usr/local/bin:/usr/bin

php_admin_value[error_log] = @PREFIX@/php/logs/php_error_log
php_admin_flag[log_errors] = on
