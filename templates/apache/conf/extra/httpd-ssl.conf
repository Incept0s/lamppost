#
# LAMPPost - HTTPS on port 443 with a self-signed certificate
# (created by install.sh for "localhost"; your browser will warn once).
#
Listen 127.0.0.1:443
Listen [::1]:443

SSLPassPhraseDialog builtin
SSLSessionCache "shmcb:@PREFIX@/apache/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
# PROFILE=SYSTEM follows the system-wide crypto policy where that exists
SSLCipherSuite @SSL_CIPHERS@
SSLProxyCipherSuite PROFILE=SYSTEM

<VirtualHost _default_:443>
    DocumentRoot "@PREFIX@/htdocs"
    ServerName localhost:443
    ServerAdmin postmaster@localhost
    Protocols h2 http/1.1

    ErrorLog "logs/ssl_error_log"
    TransferLog "logs/ssl_access_log"

    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"
</VirtualHost>
