#
# LAMPPost - Virtual Hosts
#
# Serve several sites under different names, e.g. http://myproject.localhost
# (names ending in .localhost always resolve to this computer).
#
# Remove the "#" in front of the lines below and adjust them, then restart
# Apache in the LAMPPost Control Panel.
#
#<VirtualHost *:80>
#    ServerName myproject.localhost
#    DocumentRoot "@PREFIX@/htdocs/myproject"
#    ErrorLog "logs/myproject-error_log"
#    CustomLog "logs/myproject-access_log" common
#</VirtualHost>
