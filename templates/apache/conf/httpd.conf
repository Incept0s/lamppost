#
# LAMPPost - Apache HTTP Server configuration
#
# The Apache program itself comes from your distribution and is updated by it.
# Configuration, logs and your websites live below @PREFIX@.
# Paths that do not start with "/" are relative to ServerRoot.
#
ServerRoot "@PREFIX@/apache"
DefaultRuntimeDir "@PREFIX@/apache/logs"
PidFile "@PREFIX@/apache/logs/httpd.pid"

# Only reachable from this computer. To serve other devices on your
# network, replace these with "Listen 80" (and open the firewall).
Listen 127.0.0.1:80
Listen [::1]:80

#
# Modules
#
# The list is generated by install.sh for the Apache of this distribution:
# modules that are built in are skipped, missing ones are noted. Re-run
# install.sh --force-config after installing more Apache modules.
#
Include conf/extra/httpd-modules.conf

#
# Apache runs entirely as your user - no root needed. Ports below 1024 are
# unlocked for normal programs by /etc/sysctl.d/50-lamppost.conf.
#
ServerAdmin postmaster@localhost
ServerName localhost:80
ServerTokens Full
ServerSignature On

<IfModule mpm_event_module>
    StartServers             2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadsPerChild          25
    MaxRequestWorkers        150
    MaxConnectionsPerChild   0
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "@PREFIX@/htdocs"
<Directory "@PREFIX@/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html index.htm

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "logs/error_log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" combined

TypesConfig /etc/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddDefaultCharset UTF-8
EnableSendfile on

#
# PHP (PHP-FPM, started together with Apache by LAMPPost)
#
<FilesMatch "\.(php|phar)$">
    SetHandler "proxy:unix:@PREFIX@/tmp/php-fpm.sock|fcgi://localhost"
</FilesMatch>
<Proxy "fcgi://localhost" enablereuse=on max=10>
</Proxy>

#
# phpMyAdmin (your distribution's package, settings in @PREFIX@/phpMyAdmin/config.inc.php)
#
Alias /phpmyadmin @PMA_DIR@
Alias /phpMyAdmin @PMA_DIR@
<Directory @PMA_DIR@/>
    AddDefaultCharset UTF-8
    AllowOverride None
    Require local
</Directory>
<Directory @PMA_DIR@/libraries/>
    Require all denied
</Directory>
<Directory @PMA_DIR@/templates/>
    Require all denied
</Directory>
<Directory @PMA_DIR@/setup/lib/>
    Require all denied
</Directory>
<Directory @PMA_DIR@/setup/frames/>
    Require all denied
</Directory>

#
# Server status page (http://localhost/server-status)
#
<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

Include conf/extra/httpd-ssl.conf
Include conf/extra/httpd-vhosts.conf
