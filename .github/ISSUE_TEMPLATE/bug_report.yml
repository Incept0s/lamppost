name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste passwords or the contents
        of `ftp/lamppost-ftp.ini`.
  - type: input
    id: fedora
    attributes:
      label: Fedora version
      description: "Output of: cat /etc/os-release | head -2"
      placeholder: Fedora Linux 44 (Workstation Edition)
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop
      placeholder: GNOME 50 on Wayland
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Panel log
      description: The log from the bottom of the control panel window.
      render: text
  - type: textarea
    id: module-log
    attributes:
      label: Module log (if a module fails to start)
      description: "For example /opt/lamppost/apache/logs/error_log"
      render: text
